<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – On Point Parlays</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="logo">On Point Parlays</a>
        </div>
        <div class="nav-right">
            <a href="/" class="nav-link">Home</a>
            <a href="/picks" class="nav-link">Picks</a>
            <a href="/admin" class="nav-link admin-link active">Admin</a>
        </div>
    </nav>

    <main class="admin-page">
        {% if not logged_in %}
            <!-- Login Form -->
            <div class="login-box">
                <h1>Admin Access</h1>
                <p>Enter the password to continue</p>
                <form method="POST">
                    <input type="password" name="password" placeholder="Password" required autofocus>
                    <button type="submit" class="btn-primary">Log In</button>
                </form>
            </div>
        {% else %}
            <!-- Admin Form -->
            <div class="admin-header">
                <h1>Post Daily Picks</h1>
                <a href="/logout" class="logout-btn">Log Out</a>
            </div>

            <form method="POST" class="admin-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" value="{{ today }}" required>
                </div>

                {% for sport in sports %}
                <div class="form-group">
                    <label for="{{ sport }}">{{ sport }}</label>
                    <textarea id="{{ sport }}" name="{{ sport }}" rows="6" placeholder="Paste the picks and research for {{ sport }} here...&#10;&#10;If no games, just type: No games available"></textarea>
                </div>
                {% endfor %}

                <button type="submit" class="btn-primary full-width">Publish Picks</button>
            </form>
        {% endif %}
    </main>

    <footer class="footer">
        <p>On Point Parlays &copy; 2026</p>
    </footer>
</body>
</html>
